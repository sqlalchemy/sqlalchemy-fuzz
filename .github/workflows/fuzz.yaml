name: Fuzz

# runs the fuzzers against SQLAlchemy main and rel_2_0.  differences are
# listed in the run summary, each with a command that replays it locally;
# a run fails if anything is found.  the weekly run then files the findings
# as issues in this repo, at most one open issue per fuzzer and check (see
# src/sqlalchemy_fuzz/issues.py).  see README.rst for why this runs every
# week.
#
# run from the Actions tab or with:
#
#   gh workflow run fuzz.yaml -R sqlalchemy/sqlalchemy-fuzz \
#       -f seeds=0:20000 -f refs='["main"]'
on:
  schedule:
    # mondays at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      seeds:
        description: "range of seeds, e.g. 0:20000"
        required: true
        default: "0:20000"
      refs:
        description: "SQLAlchemy refs to test, as a JSON list"
        required: true
        default: '["main", "rel_2_0"]'
      file_issues:
        description: "file findings as issues, as the weekly run does"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  fuzz:
    name: ${{ matrix.fuzzer }}-${{ matrix.ref }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ fromJSON(inputs.refs || '["main", "rel_2_0"]') }}
        fuzzer:
          - orm-loading

    steps:
      - name: Checkout sqlalchemy-fuzz
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Checkout SQLAlchemy ${{ matrix.ref }}
        uses: actions/checkout@v7
        with:
          repository: sqlalchemy/sqlalchemy
          ref: ${{ matrix.ref }}
          path: sqlalchemy
          persist-credentials: false

      - name: Set up python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install SQLAlchemy and sqlalchemy-fuzz into a virtualenv
        env:
          # fail rather than silently falling back to pure python
          REQUIRE_SQLALCHEMY_CEXT: "1"
          REF: ${{ matrix.ref }}
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install ./sqlalchemy
          .venv/bin/python -m pip install .
          .venv/bin/python -m pip list
          echo "SQLALCHEMY_SHA=$(git -C sqlalchemy rev-parse HEAD)" \
            >> "$GITHUB_ENV"
          echo "SQLALCHEMY_FUZZ_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "SQLALCHEMY_REF=$REF" >> "$GITHUB_ENV"
          mkdir results

      - name: Run on fixed seeds
        env:
          SEEDS: ${{ inputs.seeds || '0:20000' }}
          FUZZER: ${{ matrix.fuzzer }}
        run: |
          .venv/bin/sqla-fuzz "$FUZZER" \
            --seeds "$SEEDS" --markdown "$GITHUB_STEP_SUMMARY" \
            --json "results/$FUZZER-$SQLALCHEMY_REF-fixed.json"

      - name: Run on this week's seeds
        # runs even if the fixed seeds found something
        if: ${{ !cancelled() && github.event_name == 'schedule' }}
        env:
          FUZZER: ${{ matrix.fuzzer }}
        run: |
          week=$(( $(date +%s) / 604800 ))
          lo=$(( 20000 + (week % 10000) * 20000 ))
          .venv/bin/sqla-fuzz "$FUZZER" \
            --seeds "$lo:$(( lo + 20000 ))" --markdown "$GITHUB_STEP_SUMMARY" \
            --json "results/$FUZZER-$SQLALCHEMY_REF-weekly.json"

      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: results-${{ matrix.fuzzer }}-${{ matrix.ref }}
          path: results/

  file-issues:
    name: file-issues
    needs: fuzz
    if: >-
      ${{ !cancelled()
          && (github.event_name == 'schedule' || inputs.file_issues) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout sqlalchemy-fuzz
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Download results
        uses: actions/download-artifact@v8
        with:
          pattern: results-*
          path: results
          merge-multiple: true

      - name: File issues
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: >-
            ${{ github.server_url }}/${{ github.repository
            }}/actions/runs/${{ github.run_id }}
        run: |
          python -m pip install .
          sqla-fuzz-issues results/*.json \
            --repo "$GITHUB_REPOSITORY" --run-url "$RUN_URL"
